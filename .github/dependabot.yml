# SR-4: weekly updates for Python packages and SHA-pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: pip
    directory: /config
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
